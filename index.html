<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="color-scheme" content="dark" />
    <title>Ledger</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div class="glow-layer" aria-hidden="true">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>

    <div class="container">
      <header class="site-header">
        <h1><em>Ledger</em></h1>
        <p>A record of cities · their character · and my place in them</p>
      </header>

      <!-- Status + import/export bar -->
      <div class="file-bar">
        <div class="file-dot" id="fileDot" aria-hidden="true"></div>
        <span class="file-status" id="fileStatus" role="status">Loading…</span>
        <div class="file-actions">
          <button type="button" class="btn btn-ghost" id="btnImport">
            Import
          </button>
          <button type="button" class="btn btn-ghost" id="btnExport">
            Export
          </button>
        </div>
        <input
          type="file"
          id="importFile"
          class="visually-hidden"
          accept=".md,text/markdown,text/plain"
          tabindex="-1"
          aria-hidden="true"
        />
      </div>

      <nav class="tab-nav" role="tablist" aria-label="Sections">
        <button
          type="button"
          class="tab-btn active"
          id="tabNew"
          role="tab"
          aria-selected="true"
          aria-controls="viewNew"
        >
          Entry
        </button>
        <button
          type="button"
          class="tab-btn"
          id="tabLogbook"
          role="tab"
          aria-selected="false"
          aria-controls="viewLogbook"
        >
          Ledger <span class="tab-badge" id="entryBadge">0</span>
        </button>
      </nav>

      <!-- ══ NEW ENTRY VIEW ══ -->
      <section id="viewNew" role="tabpanel" aria-labelledby="tabNew">
        <div class="panel panel--raised">
          <div class="section-head section-head--compact">
            <h2>Location &amp; Date</h2>
          </div>
          <div class="city-row">
            <div class="field-group">
              <label class="field-label" for="inputCity">City</label>
              <input
                type="text"
                class="field-input"
                id="inputCity"
                placeholder="e.g. Austin"
                autocomplete="off"
                enterkeyhint="next"
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="inputState">State / Country</label>
              <input
                type="text"
                class="field-input"
                id="inputState"
                placeholder="e.g. Texas"
                autocomplete="off"
                enterkeyhint="next"
              />
            </div>
            <div class="field-group">
              <label class="field-label" for="inputDate">Month of Visit</label>
              <div class="dp-wrapper">
                <input
                  type="text"
                  class="field-input field-input--date"
                  id="inputDate"
                  placeholder="Select month..."
                  readonly
                  aria-haspopup="dialog"
                  aria-expanded="false"
                  aria-controls="dpPopup"
                />
                <div
                  class="dp-popup"
                  id="dpPopup"
                  role="dialog"
                  aria-label="Choose month of visit"
                >
                  <div class="dp-header">
                    <button
                      type="button"
                      class="dp-nav-btn"
                      id="dpPrevYear"
                      aria-label="Previous year"
                    >
                      <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                      >
                        <polyline points="15 18 9 12 15 6"></polyline>
                      </svg>
                    </button>
                    <div
                      class="dp-month-year"
                      id="dpYearLabel"
                      aria-live="polite"
                    ></div>
                    <button
                      type="button"
                      class="dp-nav-btn"
                      id="dpNextYear"
                      aria-label="Next year"
                    >
                      <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                      >
                        <polyline points="9 18 15 12 9 6"></polyline>
                      </svg>
                    </button>
                  </div>
                  <div class="dp-grid" id="dpGrid"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="score-panel">
          <div class="score-arc-wrap" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none">
              <circle
                cx="50"
                cy="50"
                r="40"
                stroke="rgba(68,64,60,0.25)"
                stroke-width="5.5"
              />
              <circle
                cx="50"
                cy="50"
                r="40"
                id="scoreArc"
                stroke="#d4a574"
                stroke-width="5.5"
                stroke-dasharray="251.33"
                stroke-dashoffset="251.33"
                stroke-linecap="round"
                transform="rotate(-90 50 50)"
              />
            </svg>
          </div>
          <div class="score-info" aria-live="polite">
            <div class="score-label">Weighted Score</div>
            <div class="score-number">
              <span id="scoreDisplay">—</span><span> / 100</span>
            </div>
            <div class="score-desc" id="scoreDesc">
              Rate the metrics below to calculate your score.
            </div>
          </div>
        </div>

        <!-- Metric panels are rendered from src/domain/metrics.ts -->
        <div id="metricPanels"></div>

        <div class="panel">
          <div class="section-head section-head--compact">
            <h2><label for="inputNotes">Impressions</label></h2>
          </div>
          <textarea
            class="notes-area"
            id="inputNotes"
            placeholder="First impressions, standout moments, things to remember about this city…"
          ></textarea>
        </div>

        <div class="save-row">
          <span class="save-hint" id="saveHint">Designed by Mehul</span>
          <button type="button" class="btn btn-ghost" id="btnClear">Clear</button>
          <button type="button" class="btn btn-primary" id="btnSave">
            Save Entry
          </button>
        </div>
      </section>

      <!-- ══ LEDGER VIEW ══ -->
      <section
        id="viewLogbook"
        role="tabpanel"
        aria-labelledby="tabLogbook"
        hidden
      >
        <div class="logbook-header">
          <h2>Your Cities</h2>
          <span class="logbook-count" id="logbookCount">0 entries</span>
        </div>

        <div class="logbook-controls">
          <input
            type="search"
            id="searchLogbook"
            class="search-bar"
            placeholder="Search cities, states, or notes..."
            aria-label="Search entries"
          />
          <div class="sort-row" role="group" aria-label="Sort entries">
            <span class="sort-label">Sort</span>
            <button
              type="button"
              class="sort-btn active"
              data-sort="date"
              aria-pressed="true"
            >
              Date
            </button>
            <button
              type="button"
              class="sort-btn"
              data-sort="score"
              aria-pressed="false"
            >
              Score
            </button>
            <button
              type="button"
              class="sort-btn"
              data-sort="city"
              aria-pressed="false"
            >
              Alphabetical
            </button>
          </div>
        </div>

        <div id="entriesList"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
