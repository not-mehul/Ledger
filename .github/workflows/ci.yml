name: CI

# One quick job on pull requests and on pushes to main: tokens, formatting,
# lint, types, the unit suite and a production build. The heavier suites
# (Playwright, Android and iOS builds, the emulator) live in full-checks.yml
# and run only when started by hand from the Actions tab. Releases run their
# own checks in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
