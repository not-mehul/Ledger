name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run sync
      - name: Assemble, lint
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest lintDebug
      - name: Sign the release APK with the debug key for the smoke test
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --out android/app/build/outputs/apk/release/app-release-smoke.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ledger-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-smoke.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  android-emulator:
    name: Android emulator tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 40
    # Non-blocking for API 37 only: on the current API 37 emulator images,
    # system_server itself aborts in its task-snapshot thread with
    # "Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"
    # (a guest graphics driver bug), whatever the renderer. Ledger launches
    # and its first test passes before that crash. Remove `experimental`
    # once a fixed image ships; API 36 remains a required gate.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 37 is the target SDK; 36 covers the previous release. Ledger uses no
        # Google APIs, so API 37 runs on the leaner AOSP ("default") image.
        include:
          - api-level: '37.0'
            target: default
            experimental: true
          - api-level: '36'
            target: google_apis
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ledger-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          # Start adb before the emulator; if the emulator comes up first it can
          # stay "offline" for the whole boot timeout.
          pre-emulator-launch-script: adb start-server
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: scripts/android-emulator-tests.sh apks

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build for the simulator
        shell: bash # -eo pipefail, so a failed xcodebuild fails the step
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
